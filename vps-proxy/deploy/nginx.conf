# Kiro Proxy — Nginx Reverse Proxy
# Поместить в /etc/nginx/sites-available/kiro-proxy
# ln -s /etc/nginx/sites-available/kiro-proxy /etc/nginx/sites-enabled/

# Rate limiting
limit_req_zone $binary_remote_addr zone=kiro_api:10m rate=10r/s;

upstream kiro_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;  # ← Заменить на свой домен

    # Redirect HTTP → HTTPS (раскомментировать после certbot)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://kiro_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / Streaming support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Таймауты для длинных стримов
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Rate limiting (10 req/sec burst 20)
        limit_req zone=kiro_api burst=20 nodelay;
    }

    # Health check — без rate limit
    location /health {
        proxy_pass http://kiro_backend/health;
        limit_req off;
    }
}

